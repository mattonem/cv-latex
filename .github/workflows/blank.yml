name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Set up Git repository
      uses: actions/checkout@v4

    - name: LaTeX compilation
      uses: xu-cheng/latex-action@1.2.0
      with:
        root_file: main.tex

    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: resume
        path: main.pdf

    - name: Prepare GitHub Pages folder
      run: |
        mkdir -p "public/${GITHUB_REF_NAME}"
        cp main.pdf "public/${GITHUB_REF_NAME}/main.pdf"

    - name: Deploy PDF to gh-pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./public
        keep_files: true
