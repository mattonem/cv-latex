name: Build and deploy PDF

on:
  push:
    branches-ignore:
      - gh-pages

permissions:
  contents: write

concurrency:
  group: github-pages-pdf
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@1.2.0
        with:
          root_file: main.tex

      - name: Prepare the branch deployment
        id: deployment
        shell: bash
        run: |
          branch_name="$(printf '%s' "${GITHUB_REF_NAME}" | sed 's#[^A-Za-z0-9._-]#-#g')"
          deploy_dir="site/${branch_name}"
          mkdir -p "${deploy_dir}"
          cp main.pdf "${deploy_dir}/main.pdf"
          printf '%s\n' \
            '<!doctype html>' \
            '<meta http-equiv="refresh" content="0; url=main.pdf">' \
            '<title>CV PDF</title>' \
            > "${deploy_dir}/index.html"
          echo "branch_name=${branch_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-${{ steps.deployment.outputs.branch_name }}
          path: main.pdf

      - name: Deploy PDF to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
